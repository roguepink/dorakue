function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  VS=Math.min(innerWidth/W,innerHeight/H);
  cv.width=Math.round(W*VS*dpr); cv.height=Math.round(H*VS*dpr);
  cv.style.width=Math.round(W*VS)+'px'; cv.style.height=Math.round(H*VS)+'px';
  ctx.setTransform(VS*dpr,0,0,VS*dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}

// ---------------------------------------------------------------- Audio
const AU={ctx:null,on:true,
  init(){
    if(this.ctx)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=0.6; this.master.connect(this.ctx.destination);
      this.bgm=this.ctx.createGain(); this.bgm.gain.value=0.26; this.bgm.connect(this.master);
      this.sfx=this.ctx.createGain(); this.sfx.gain.value=0.5; this.sfx.connect(this.master);
      const len=this.ctx.sampleRate; const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; this.noiseBuf=buf;
      if(SEQ.pending){const p=SEQ.pending;SEQ.pending=null;SEQ.play(p);}
    }catch(e){}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  toggle(){ this.on=!this.on; if(this.master)this.master.gain.value=this.on?0.6:0; },
  now(){ return this.ctx?this.ctx.currentTime:0; },
  tone(o){
    if(!this.ctx)return; const c=this.ctx; const t=o.t!=null?o.t:c.currentTime;
    const osc=c.createOscillator(); osc.type=o.type||'square';
    osc.frequency.setValueAtTime(o.f,t); if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);
    const g=c.createGain(); const v=o.v!=null?o.v:0.2; const a=o.a!=null?o.a:0.005, r=o.r!=null?o.r:0.03;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a);
    g.gain.setValueAtTime(v,Math.max(t+a,t+o.d-r)); g.gain.linearRampToValueAtTime(0,t+o.d);
    osc.connect(g); g.connect(o.dest||this.sfx); osc.start(t); osc.stop(t+o.d+0.02);
  },
  noise(o){
    if(!this.ctx)return; const c=this.ctx; const t=o.t!=null?o.t:c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true;
    const g=c.createGain(); g.gain.setValueAtTime(o.v!=null?o.v:0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+o.d);
    let n=s; if(o.f){const fl=c.createBiquadFilter(); fl.type=o.hp?'highpass':'lowpass'; fl.frequency.value=o.f; s.connect(fl); n=fl;}
    n.connect(g); g.connect(o.dest||this.sfx); s.start(t); s.stop(t+o.d+0.02);
  }
};
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midi(name){ const m=/^([A-G])([#b]?)(\d)$/.exec(name); if(!m)return 0; return NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(parseInt(m[3])+1)*12; }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function parseNotes(s){
  const out=[]; for(const tok of s.split(/\s+/)){ if(!tok||tok==='|')continue; const [n,b]=tok.split(':'); const beats=parseFloat(b||'1');
    let m=0; if(n==='r')m=0; else if(n==='x')m=-1; else if(n==='k')m=-2; else if(n==='s')m=-3; else m=midi(n);
    out.push({m,b:beats}); }
  return out;
}
const SEQ={cur:null,tracks:null,timer:null,playing:false,pending:null,
  play(name){
    const song=SONGS[name]; if(!song)return;
    if(!AU.ctx){this.pending=name;return;}
    if(this.cur===name&&this.playing)return;
    this.stop(); this.cur=name; this.playing=true; this.loop=song.loop!==false;
    this.bt=60/song.bpm; const t0=AU.ctx.currentTime+0.08;
    this.tracks=song.tracks.map(tr=>({tr,notes:parseNotes(tr.n),i:0,t:t0,done:false}));
    this.timer=setInterval(()=>this.tick(),60); this.tick();
  },
  stop(){ if(this.timer)clearInterval(this.timer); this.timer=null; this.playing=false; this.cur=null; },
  tick(){
    const c=AU.ctx; if(!c)return; const horizon=c.currentTime+0.3;
    for(const T of this.tracks){
      let guard=0;
      while(!T.done&&T.t<horizon&&guard++<64){
        const n=T.notes[T.i]; const dur=n.b*this.bt; const tr=T.tr;
        if(n.m>0){ AU.tone({f:mtof(n.m),d:dur*(tr.st||0.85),type:tr.w||'square',v:tr.v||0.15,t:T.t,dest:AU.bgm,a:0.01,r:0.04}); }
        else if(n.m===-1){ AU.noise({d:0.05,v:0.05,t:T.t,f:7000,hp:true,dest:AU.bgm}); }
        else if(n.m===-2){ AU.tone({f:150,f2:45,d:0.12,type:'triangle',v:0.35,t:T.t,dest:AU.bgm}); }
        else if(n.m===-3){ AU.noise({d:0.12,v:0.12,t:T.t,f:1800,dest:AU.bgm}); AU.tone({f:220,f2:120,d:0.08,type:'triangle',v:0.15,t:T.t,dest:AU.bgm}); }
        T.t+=dur; T.i++;
        if(T.i>=T.notes.length){ if(this.loop)T.i=0; else T.done=true; }
      }
    }
    if(this.tracks.every(T=>T.done))this.stop();
  }
};

}

function dspr(img,x,y,alpha){
  if(alpha!=null){ctx.globalAlpha=alpha;}
  ctx.drawImage(img,Math.round(x-img.width/2),Math.round(y-img.height/2));
  if(alpha!=null)ctx.globalAlpha=1;
}
function txt(s,x,y,size,col,align,shadow){

function spawnWave(){

  for(const [tp,wt] of st.pool){ r-=wt; if(r<=0){type=tp;break;} }

      break;}

function spawnBoss(){

function nearestEnemy(x,y,preferBoss){
  let best=null,bd=1e9;
  for(const e of G.enemies){ if(e.entering||e.y<-10)continue; let d=hyp(e.x-x,e.y-y); if(preferBoss&&e.def.boss)d*=0.3; if(d<bd){bd=d;best=e;} }
  return best;
}

// ---------------------------------------------------------------- Update
function update(dt){
  if(!G){ titleT+=dt; return; }
  if(G.paused)return;
  const slow=G.menu.open?0.08:1; const d=dt*slow;
  G.t+=d; G.bgY+=70*d;
  if(G.shake>0)G.shake=Math.max(0,G.shake-40*dt);
  if(G.flash){G.flash.t-=dt;if(G.flash.t<=0)G.flash=null;}
  updateParty(d);
  updateStage(d);
  updateEnemies(d);
  updateBullets(d);
  updateDrops(d);
  updateFx(d);
  if(G.state==='play')collisions();
  if(G.state==='over')G.overT+=dt;
  if(G.state==='clear')G.clearT+=dt;
}
function updateParty(d){
  const h=G.head;
  if(G.state==='play'&&!G.menu.open&&!G.dead){
    let dx=0,dy=0;
    if(keys.ArrowLeft||keys.KeyA)dx-=1; if(keys.ArrowRight||keys.KeyD)dx+=1;
    if(keys.ArrowUp||keys.KeyW)dy-=1; if(keys.ArrowDown||keys.KeyS)dy+=1;
    if(dx||dy){ const sp=(keys.ShiftLeft||keys.ShiftRight)?110:220; const l=hyp(dx,dy); h.x=clamp(h.x+dx/l*sp*d,16,W-16); h.y=clamp(h.y+dy/l*sp*d,90,H-95); G.lastMove=G.t; }
  }
  const last=G.trail[G.trail.length-1];
  if(!last||hyp(last.x-h.x,last.y-h.y)>=2.5){ G.trail.push({x:h.x,y:h.y}); if(G.trail.length>400)G.trail.shift(); }
  // 隊列: 生きている仲間が前、ひつぎは後ろ
  const order=party.filter(m=>m.alive).concat(party.filter(m=>!m.alive));
  for(let i=0;i<order.length;i++){
    const m=order[i]; let tx=h.x,ty=h.y;
    if(i>0){ let need=i*SPACING, px=h.x,py=h.y, ok=false;
      for(let k=G.trail.length-1;k>=0;k--){const p=G.trail[k]; const dd=hyp(p.x-px,p.y-py); if(dd>=need){const f=need/dd; tx=px+(p.x-px)*f; ty=py+(p.y-py)*f; ok=true; break;} need-=dd; px=p.x; py=p.y;}
      if(!ok){tx=px;ty=py;} }
    const k=Math.min(1,d*14); m.x+=(tx-m.x)*k; m.y+=(ty-m.y)*k;
    m.inv=Math.max(0,m.inv-d); m.bob+=d*(G.t-G.lastMove<0.15?10:0);
  }
  if(G.dead||G.state!=='play')return;
  // 各キャラの攻撃
  for(const m of party){
    if(!m.alive)continue; m.cd-=d; m.t+=d; m.t2+=d;
    if(m.key==='hero'&&m.cd<=0){
      m.cd=0.17; const lv=G.weapon; const dmg=[1.2,1.6,2.1][lv]; const col=['#e8e8ff','#a0e0ff','#ffa040'][lv];
      const shots=lv===0?[[0,0]]:lv===1?[[-6,0],[6,0]]:[[0,0],[-8,-0.22],[8,0.22]];
      for(const [ox,a] of shots)G.pb.push({x:m.x+ox,y:m.y-14,vx:Math.sin(a)*420,vy:-Math.cos(a)*420,r:4,dmg,kind:'sword',col,life:2});
      SFX.shoot();
    }
    if(m.key==='war'&&m.cd<=0){
      let near=null; for(const e of G.enemies){ if(e.entering)continue; if(hyp(e.x-m.x,e.y-m.y)<80+e.r){near=e;break;} }
      if(near){ m.cd=0.55; SFX.slash(); G.beams.push({slash:true,x:m.x,y:m.y,life:0.18});
        for(const e of G.enemies.slice()){ if(e.entering)continue; if(hyp(e.x-m.x,e.y-m.y)<82+e.r)damageEnemy(e,5,Math.random()<0.12); } }
    }
    if(m.key==='mage'&&m.cd<=0){
      m.cd=0.8; const tg=nearestEnemy(m.x,m.y,false);
      G.pb.push({x:m.x,y:m.y-10,vx:0,vy:-240,r:5,dmg:3,kind:'bolt',home:3,tg,col:'#c070f0',life:3}); SFX.bolt();
    }
    if(m.key==='priest'){
      if(m.t>=7){ m.t=0; const hurt=party.filter(x=>x.alive&&x.hp<x.maxHp);
        if(hurt.length){ for(const x of hurt){x.hp=Math.min(x.maxHp,x.hp+5);burst(x.x,x.y,'#80ff80',5,50);} addMsg(m.name+'は ホミィを となえた！'); SFX.heal(); } }
      if(m.t2>=11){ m.t2=0; const dead=party.filter(x=>!x.alive);
        if(dead.length){ const tgt=dead[0]; addMsg(m.name+'は ザオリルを となえた！');
          if(Math.random()<0.55){ tgt.alive=true; tgt.hp=Math.ceil(tgt.maxHp*0.5); tgt.inv=1.5; addMsg(tgt.name+'は いきかえった！'); SFX.revive(); burst(tgt.x,tgt.y,'#ffffa0',16,100); }
          else addMsg('…しかし '+tgt.name+'は いきかえらなかった'); } }
    }
  }
}
function updateStage(d){
  if(G.state!=='play')return;
  const st=STAGES[G.stage]; G.phaseT+=d;
  if(G.phase==='intro'){ if(G.phaseT>2.2){G.phase='wave';G.phaseT=0;} return; }
  if(G.phase==='wave'){
    G.stageT+=d; G.spawnT-=d;
    if(G.spawnT<=0){ spawnWave(); const f=clamp(G.stageT/st.dur,0,1); G.spawnT=st.spawn[0]+(st.spawn[1]-st.spawn[0])*f; }
    if(G.stageT>=st.dur){G.phase='wait';G.phaseT=0;}
  }else if(G.phase==='wait'){
    if(G.enemies.length===0||G.phaseT>7){ G.phase='boss'; G.phaseT=0; spawnBoss(); }
  }else if(G.phase==='boss'){
    if(G.bossDying){ const bd=G.bossDying; bd.t+=d; bd.n-=d;
      if(bd.n<=0){bd.n=0.12; burst(bd.x+rnd(-30,30),bd.y+rnd(-30,30),pick(['#ffd040','#f86020','#fff']),10,140); SFX.explode(); G.shake=8;}
      if(bd.t>1.7){ G.bossDying=null; SFX.bigexp(); burst(bd.x,bd.y,'#fff',40,220); G.flash={col:'rgba(255,255,255,0.8)',t:0.4};
        addMsg(bd.name+'を たおした！'); G.gold+=bd.sc; text(bd.x,bd.y,'+'+bd.sc+'G','#ffe060',16);
        if(G.stage>=STAGES.length-1){ G.state='clear'; G.clearT=0; addMsg('せかいに へいわが もどった！'); SEQ.play('clear'); saveBest(); }
        else { G.phase='clear'; G.phaseT=0; addMsg('だい'+(G.stage+1)+'しょう クリア！'); SEQ.play('clear'); } } }
  }else if(G.phase==='clear'){
    if(G.phaseT>3.5)startStage(G.stage+1);
  }
}
function aimAt(e,tx,ty,sp,spread,col,r,dmg,extra){
  const a=Math.atan2(ty-e.y,tx-e.x)+(spread||0);
  G.eb.push(Object.assign({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:r||4,col:col||'#ff8080',dmg:dmg||3,life:7},extra||{}));
}
function headPos(){ const m=party.find(x=>x.alive)||party[0]; return {x:m.x,y:m.y}; }
function updateEnemies(d){
  const hp=headPos();
  for(const e of G.enemies.slice()){
    e.t+=d; if(e.flash>0)e.flash-=d;
    if(e.frozen>0){ e.frozen-=d; continue; }
    const p=e.p;
    switch(e.type){
      case 'purun': e.y+=55*d; e.x+=Math.sin(e.t*3+p.ph)*45*d; break;
      case 'basakey': e.x+=p.dir*125*d; e.y=p.y0+Math.sin(e.t*4)*28+e.t*20; break;
      case 'yurei':

function updateBullets(d){

    if(b.life<=0||b.y<-30||b.y>H+30||b.x<-30||b.x>W+30)G.pb.splice(G.pb.indexOf(b),1);

    if(b.home){ const want=Math.atan2(hp.y-b.y,hp.x-b.x); let cur=Math.atan2(b.vy,b.vx); let diff=Math.atan2(Math.sin(want-cur),Math.cos(want-cur)); cur+=clamp(diff,-b.home*d,b.home*d); const sp=hyp(b.vx,b.vy); b.vx=Math.cos(cur)*sp; b.vy=Math.sin(cur)*sp; }

function killEnemy(e){

function collisions(){

  win(4,4,W-8,66);
  const sw=(W-24)/4;
  party.forEach((m,i)=>{ const x=12+i*sw; const f=m.hp/m.maxHp;
    txt(m.name,x,11,11,m.alive?'#fff':'#808090');
    ctx.fillStyle='#303040'; ctx.fillRect(x,25,sw-10,6); ctx.fillStyle=hpCol(f); ctx.fillRect(x,25,(sw-10)*f,6);
    txt(m.alive?'HP '+m.hp:'しぼう',x,34,10,m.alive?'#d0d0e0':'#f06060'); });
  txt('MP',12,52,11,'#c0a0ff'); ctx.fillStyle='#303040'; ctx.fillRect(34,55,110,7); ctx.fillStyle='#a060ff'; ctx.fillRect(34,55,110*G.mp/G.mpMax,7);
  txt(G.mp+'/'+G.mpMax,148,52,10,'#d0c0ff');
  txt(WEAPONS[G.weapon],W-96,52,10,'#ffd080','right'); txt(G.gold+'G',W-14,50,13,'#ffe060','right');
  // ボスゲージ
  const b=G.boss; if(b&&!b.entering){ win(40,74,W-80,22,0.7); txt(b.def.name,48,78,11,'#ffb0b0'); ctx.fillStyle='#303040'; ctx.fillRect(140,80,W-190,9); ctx.fillStyle=b.p2?'#ff4060':'#ff8040'; ctx.fillRect(140,80,(W-190)*clamp(b.hp/b.maxHp,0,1),9); }
  // メッセージ
  win(4,H-74,W-8,70);
  G.msgs.forEach((s,i)=>txt(s,14,H-64+i*19,12,i===G.msgs.length-1?'#fff':'#c8c8d8'));
  // 呪文ボタン
  const bx=W-42,by=H-118; ctx.globalAlpha=0.75; ctx.fillStyle='#101030'; ctx.beginPath(); ctx.arc(bx,by,28,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1;
  txt('じゅもん',bx,by-11,10,'#fff','center'); txt('MP'+G.mp,bx,by+2,10,'#c0a0ff','center');
  // 音量
  txt(AU.on?'♪':'×',W-28,6,13,'#fff','center');
  if(G.paused){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H); txt('PAUSE',W/2,H/2-10,24,'#fff','center',true); }
}
function drawMenu(){
  const x=36,y=200,w=W-72,h=44+SPELLS.length*30+8; win(x,y,w,h);
  txt('じゅもん',x+14,y+12,14,'#fff'); txt('MP '+G.mp+'/'+G.mpMax,x+w-14,y+12,13,'#c0a0ff','right');
  SPELLS.forEach((s,i)=>{ const yy=y+44+i*30; const caster=member(s.need); const ok=caster.alive&&G.mp>=s.mp; const col=ok?'#fff':'#707080';
    if(i===G.menu.sel)txt('▶',x+12,yy,14,'#fff'); txt(s.n,x+32,yy,14,col); txt(s.mp+'MP',x+w-16,yy+1,12,ok?'#d0c0ff':'#707080','right');
    if(!caster.alive)txt('×',x+w-62,yy,12,'#f06060','right'); });
  const s=SPELLS[G.menu.sel]; win(x,y+h+4,w,46); txt(s.desc,x+12,y+h+14,11,'#e0e0f0'); txt('Z/Enter: けってい  X: もどる',x+12,y+h+30,10,'#8080a0');
}
function drawTitle(){
  drawBg(0,titleT*40);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H);
  win(20,70,W-40,120);
  txt('ゆうしゃの たいれつ',W/2,96,30,'#ffe060','center',true);
  txt('〜 レトロRPGふう たてスクロール シューティング 〜',W/2,142,11,'#fff','center');
  txt('じゅもんコマンドで まおうを たおせ！',W/2,162,11,'#c0c0ff','center');
  const by=250+Math.sin(titleT*6)*3; const xs=W/2-54+(titleT*30)%(W+140)-70;
  const list=['hero','war','mage','priest']; list.forEach((k,i)=>dspr(SPR[k],xs-i*32,by+Math.sin(titleT*10+i)*2));
  win(20,290,W-40,190);
  const lines=['いどう： ほうこうキー / WASD / ドラッグ','じゅもん： X / Enter / がめんのボタン','こうげきは オートで おこなわれる','なかまが たおれると ひつぎになり','そうりょが いきていれば いきかえる かも','M： おんりょう ON/OFF   P： ポーズ'];
  lines.forEach((s,i)=>txt(s,36,306+i*26,12,i===3||i===4?'#c0e0ff':'#fff'));
  if(Math.floor(titleT*2)%2===0)txt('▶ Z / Enter / タップ で はじめる',W/2,520,14,'#fff','center',true);
  txt('さいこうきろく： '+best+'G',W/2,560,12,'#ffe060','center');
  txt('♪ BGM・こうかおんは すべて オリジナル',W/2,600,10,'#a0a0c0','center');
  txt(AU.on?'♪':'×',W-28,6,13,'#fff','center');
}
function drawEnd(){
  const over=G.state==='over'; const t=over?G.overT:G.clearT; if(t<0.8)return;
  ctx.fillStyle='rgba(0,0,0,'+clamp((t-0.8)*0.8,0,0.65)+')'; ctx.fillRect(0,0,W,H);
  win(24,200,W-48,220);
  if(over){ txt('おうさま',40,216,12,'#ffe060'); txt('「おお ゆうしゃ アレンよ…',40,238,13); txt('  ここで たおれてしまうとは…',40,258,13); txt('  じゃが あきらめては ならぬ！」',40,278,13); }
  else { txt('まおうゾルガを たおした！',W/2,222,16,'#ffe060','center'); txt('せかいに へいわが もどった！',W/2,250,14,'#fff','center'); txt('ゆうしゃたちの たびは つづく…',W/2,278,12,'#c0c0ff','center'); }
  txt('こんかいの せいか： '+G.gold+'G',40,318,13,'#fff'); txt('たおした まもの： '+G.kills,40,340,13,'#fff');
  if(G.gold>=best&&G.gold>0)txt('さいこうきろく こうしん！',40,362,13,'#ffe060');
  if(t>1.5&&Math.floor(t*2)%2===0)txt('▶ Z / タップ で タイトルへ',W/2,392,13,'#fff','center');
}
function draw(){
  ctx.save();
  if(!G){ drawTitle(); ctx.restore(); return; }
  if(G.shake>0)ctx.translate(rnd(-G.shake,G.shake)*0.5,rnd(-G.shake,G.shake)*0.5);
  drawBg(G.stage,G.bgY);
  drawDrops(); drawEnemies(); drawParty(); drawBullets(); drawFx();
  if(G.flash){ ctx.fillStyle=G.flash.col; ctx.globalAlpha=clamp(G.flash.t*2,0,1); ctx.fillRect(-20,-20,W+40,H+40); ctx.globalAlpha=1; }
  ctx.restore();
  if(G.phase==='intro'&&G.phaseT<2.2){ win(40,H/2-40,W-80,60); txt('だい'+(G.stage+1)+'しょう',W/2,H/2-28,13,'#ffe060','center'); txt(STAGES[G.stage].name,W/2,H/2-8,18,'#fff','center'); }
  drawHud();
  if(G.menu.open)drawMenu();
  if(G.state==='over'||G.state==='clear')drawEnd();
}

// ---------------------------------------------------------------- Loop
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  try{ update(dt); draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
</script>
