const AU={ctx:null,on:true,
  init(){
    if(this.ctx)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=0.6; this.master.connect(this.ctx.destination);
      this.bgm=this.ctx.createGain(); this.bgm.gain.value=0.26; this.bgm.connect(this.master);
      this.sfx=this.ctx.createGain(); this.sfx.gain.value=0.5; this.sfx.connect(this.master);
      const len=this.ctx.sampleRate; const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; this.noiseBuf=buf;
      if(SEQ.pending){const p=SEQ.pending;SEQ.pending=null;SEQ.play(p);}
    }catch(e){}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  toggle(){ this.on=!this.on; if(this.master)this.master.gain.value=this.on?0.6:0; },
  now(){ return this.ctx?this.ctx.currentTime:0; },
  tone(o){
    if(!this.ctx)return; const c=this.ctx; const t=o.t!=null?o.t:c.currentTime;
    const osc=c.createOscillator(); osc.type=o.type||'square';
    osc.frequency.setValueAtTime(o.f,t); if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);
    const g=c.createGain(); const v=o.v!=null?o.v:0.2; const a=o.a!=null?o.a:0.005, r=o.r!=null?o.r:0.03;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a);
    g.gain.setValueAtTime(v,Math.max(t+a,t+o.d-r)); g.gain.linearRampToValueAtTime(0,t+o.d);
    osc.connect(g); g.connect(o.dest||this.sfx); osc.start(t); osc.stop(t+o.d+0.02);
  },
  noise(o){
    if(!this.ctx)return; const c=this.ctx; const t=o.t!=null?o.t:c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true;
    const g=c.createGain(); g.gain.setValueAtTime(o.v!=null?o.v:0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+o.d);
    let n=s; if(o.f){const fl=c.createBiquadFilter(); fl.type=o.hp?'highpass':'lowpass'; fl.frequency.value=o.f; s.connect(fl); n=fl;}
    n.connect(g); g.connect(o.dest||this.sfx); s.start(t); s.stop(t+o.d+0.02);
  }
};
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midi(name){ const m=/^([A-G])([#b]?)(\d)$/.exec(name); if(!m)return 0; return NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(parseInt(m[3])+1)*12; }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function parseNotes(s){
  const out=[]; for(const tok of s.split(/\s+/)){ if(!tok||tok==='|')continue; const [n,b]=tok.split(':'); const beats=parseFloat(b||'1');
    let m=0; if(n==='r')m=0; else if(n==='x')m=-1; else if(n==='k')m=-2; else if(n==='s')m=-3; else m=midi(n);
    out.push({m,b:beats}); }
  return out;
}
const SEQ={cur:null,tracks:null,timer:null,playing:false,pending:null,
  play(name){
    const song=SONGS[name]; if(!song)return;
    if(!AU.ctx){this.pending=name;return;}
    if(this.cur===name&&this.playing)return;
    this.stop(); this.cur=name; this.playing=true; this.loop=song.loop!==false;
    this.bt=60/song.bpm; const t0=AU.ctx.currentTime+0.08;
    this.tracks=song.tracks.map(tr=>({tr,notes:parseNotes(tr.n),i:0,t:t0,done:false}));
    this.timer=setInterval(()=>this.tick(),60); this.tick();
  },
  stop(){ if(this.timer)clearInterval(this.timer); this.timer=null; this.playing=false; this.cur=null; },
  tick(){
    const c=AU.ctx; if(!c)return; const horizon=c.currentTime+0.3;
    for(const T of this.tracks){
      let guard=0;
      while(!T.done&&T.t<horizon&&guard++<64){
        const n=T.notes[T.i]; const dur=n.b*this.bt; const tr=T.tr;
        if(n.m>0){ AU.tone({f:mtof(n.m),d:dur*(tr.st||0.85),type:tr.w||'square',v:tr.v||0.15,t:T.t,dest:AU.bgm,a:0.01,r:0.04}); }
        else if(n.m===-1){ AU.noise({d:0.05,v:0.05,t:T.t,f:7000,hp:true,dest:AU.bgm}); }
        else if(n.m===-2){ AU.tone({f:150,f2:45,d:0.12,type:'triangle',v:0.35,t:T.t,dest:AU.bgm}); }
        else if(n.m===-3){ AU.noise({d:0.12,v:0.12,t:T.t,f:1800,dest:AU.bgm}); AU.tone({f:220,f2:120,d:0.08,type:'triangle',v:0.15,t:T.t,dest:AU.bgm}); }
        T.t+=dur; T.i++;
        if(T.i>=T.notes.length){ if(this.loop)T.i=0; else T.done=true; }
      }
    }
    if(this.tracks.every(T=>T.done))this.stop();
  }
};

function dspr(img,x,y,alpha,scale){

function glow(col,r){
  const key=col+r; if(glowCache[key])return glowCache[key];
  const c=document.createElement('canvas'); c.width=c.height=r*2; const g=c.getContext('2d');
  const gr=g.createRadialGradient(r,r,0,r,r,r); gr.addColorStop(0,col); gr.addColorStop(0.4,col); gr.addColorStop(1,'rgba(0,0,0,0)');

}

function win(x,y,w,h,alpha){
  const a=alpha!=null?alpha:0.9;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,'rgba(26,28,64,'+a+')'); g.addColorStop(1,'rgba(8,8,26,'+a+')');
  ctx.fillStyle=g; rrect(x,y,w,h,5); ctx.fill(); ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle='#e2c46a'; rrect(x+1.5,y+1.5,w-3,h-3,4); ctx.stroke();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.55)'; rrect(x+5.5,y+5.5,w-11,h-11,3); ctx.stroke();
  ctx.fillStyle='#f6dc8a'; for(const [cx,cy] of [[x+4,y+4],[x+w-7,y+4],[x+4,y+h-7],[x+w-7,y+h-7]])ctx.fillRect(cx,cy,3,3);
}
function bar(x,y,w,h,f,c1,c2){
  ctx.fillStyle='#0a0a18'; rrect(x,y,w,h,2); ctx.fill();
  if(f>0){ const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,c2); g.addColorStop(0.5,c1); g.addColorStop(1,c2); ctx.fillStyle=g; rrect(x+1,y+1,Math.max(1,(w-2)*f),h-2,1.5); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(x+2,y+1.5,Math.max(0,(w-2)*f-2),1); }
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; rrect(x+0.5,y+0.5,w-1,h-1,2); ctx.stroke();
}

function onPress(code){
  wake();
  if(code==='KeyM'){AU.toggle();return;}
  if(code==='KeyF'){toggleFS();return;}
  if(!G||G.state==='title'){ if(['KeyZ','Enter','Space','KeyX'].includes(code))startGame(); return; }
  if(code==='KeyP'&&G.state==='play'){G.paused=!G.paused;return;}
  if(G.paused)return;
  if(G.state==='over'||G.state==='clear'){ if((G.state==='over'?G.overT:G.clearT)>1.5&&['KeyZ','Enter','Space','KeyX'].includes(code)){G=null;toTitle();} return; }
  if(G.state!=='play')return;
  if(G.menu.open){
    if(code==='ArrowUp'||code==='KeyW'){G.menu.sel=(G.menu.sel+SPELLS.length-1)%SPELLS.length;SFX.cursor();}
    else if(code==='ArrowDown'||code==='KeyS'){G.menu.sel=(G.menu.sel+1)%SPELLS.length;SFX.cursor();}
    else if(['KeyZ','Enter','Space'].includes(code))castSelected();
    else if(code==='KeyX'||code==='Escape'){closeMenu();}
  }else{
    if(['KeyX','Enter','Space','KeyZ'].includes(code))openMenu();
  }
}

      break;}

    if(e.def.boss){
      ctx.save(); if(e.flash>0){ctx.filter='brightness(1.3) saturate(0.6)';}
      BOSS_DRAW[e.type](e,e.x,e.y); ctx.restore();
      if(e.frozen>0){ ctx.globalAlpha=0.45; ctx.fillStyle='#a0f0ff'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+14,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
      continue;
    }
    const img=SPR[e.def.spr]; const bob=Math.sin(e.t*6)*1.5;
    shadow(e.x,e.y+img.height/2+2,img.width*0.38,4,e.type==='yurei'?0.12:0.3);
    if(e.type==='yurei')dspr(img,e.x,e.y+bob,e.alpha); else dspr(img,e.x,e.y+bob);
    if(e.flash>0){ ctx.globalAlpha=0.7; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
    if(e.frozen>0){ ctx.globalAlpha=0.5; ctx.fillStyle='#a0f0ff'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+3,0,TAU); ctx.fill(); ctx.globalAlpha=1; dglow('#a0f0ff',e.r+10,e.x,e.y,0.4); }
  }
  if(G.bossDying){ const bd=G.bossDying; ctx.save(); ctx.globalAlpha=Math.max(0,1-bd.t/1.9); BOSS_DRAW[bd.type]({t:bd.t,warn:null,p2:bd.p2},bd.x+rnd(-3,3),bd.y+rnd(-3,3)); ctx.restore(); }
}
function drawBullets(){
  for(const b of G.pb){
    if(b.kind==='sword'){ dglow(b.col,10,b.x,b.y,0.5); ctx.fillStyle=b.col; ctx.beginPath(); ctx.moveTo(b.x,b.y-12); ctx.lineTo(b.x+3,b.y+4); ctx.lineTo(b.x,b.y+8); ctx.lineTo(b.x-3,b.y+4); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillRect(b.x-1,b.y-8,2,10); }
    else if(b.kind==='fire'){ dglow('#ff8020',22,b.x,b.y,0.8); ctx.fillStyle='#ff9a30'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.fillStyle='#fff0a0'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.5,0,TAU); ctx.fill(); }
    else { dglow(b.col,14,b.x,b.y,0.7); ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,2,0,TAU); ctx.fill(); } }
  for(const b of G.eb){ if(b.delay>0)continue; dglow(b.col,b.r*3,b.x,b.y,0.55); ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.fillStyle=b.skull?'#302040':'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(b.x-b.r*0.2,b.y-b.r*0.2,b.r*0.45,0,TAU); ctx.fill(); }
  for(const bm of G.beams){
    if(bm.slash){ const a=bm.life/0.2; ctx.strokeStyle='rgba(255,255,255,'+a+')'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(bm.x,bm.y,70,Math.PI*1.1,Math.PI*1.9); ctx.stroke(); ctx.strokeStyle='rgba(180,220,255,'+a*0.7+')'; ctx.lineWidth=12; ctx.beginPath(); ctx.arc(bm.x,bm.y,64,Math.PI*1.2,Math.PI*1.8); ctx.stroke(); }
    else { ctx.globalCompositeOperation='lighter'; const g=ctx.createLinearGradient(0,bm.y-bm.h,0,bm.y+bm.h); g.addColorStop(0,'rgba(255,120,20,0)'); g.addColorStop(0.5,'rgba(255,230,120,0.95)'); g.addColorStop(1,'rgba(255,120,20,0)'); ctx.fillStyle=g; ctx.fillRect(0,bm.y-bm.h,W,bm.h*2); ctx.globalCompositeOperation='source-over'; }
  }
  for(const r of G.rings){ const f=r.t/r.life; ctx.globalAlpha=1-f; ctx.strokeStyle=r.col; ctx.lineWidth=3*(1-f)+1; ctx.beginPath(); ctx.arc(r.x,r.y,r.r*f,0,TAU); ctx.stroke(); } ctx.globalAlpha=1;
}
function drawDrops(){
  for(const d of G.drops){ const y=d.y+Math.sin(d.t*4)*3; const it=ITEMS[d.kind]; const pulse=0.6+0.4*Math.sin(d.t*6);
    shadow(d.x,d.y+16,9,3,0.3);
    dglow(it.col,26,d.x,y,0.45*pulse);
    ctx.strokeStyle=it.col; ctx.globalAlpha=0.5+0.4*pulse; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(d.x,y,15,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
    const img=d.kind==='weapon'?SPR['sword'+Math.min(2,G.weapon+1)]:SPR[d.kind]; dspr(img,d.x,y);
    otxt(d.kind==='weapon'?WEAPONS[Math.min(2,G.weapon+1)]:it.name,d.x,y+16,9,it.col,'center'); }
}
function drawFx(){
  for(const p of G.parts){ ctx.globalAlpha=clamp(p.life*2,0,1); ctx.fillStyle=p.col; ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz); } ctx.globalAlpha=1;
  for(const t of G.texts){ ctx.globalAlpha=clamp(t.life*2,0,1); otxt(t.s,t.x,t.y,t.size,t.col,'center'); } ctx.globalAlpha=1;
}
function hpCol(f){ return f>0.5?['#3ad060','#1a8a38']:f>0.25?['#f8d040','#a08010']:['#f04040','#801818']; }
function drawHud(){
  win(4,4,W-8,70);
  const sw=(W-24)/4;
  party.forEach((m,i)=>{ const x=12+i*sw; const f=m.hp/m.maxHp; const c=hpCol(f);
    ctx.save(); ctx.beginPath(); ctx.rect(x,10,18,20); ctx.clip(); dspr(m.alive?SPR[m.spr]:SPR.coffin,x+9,22,m.alive?1:0.6,0.6); ctx.restore();
    txt(m.name,x+21,11,11,m.alive?'#fff':'#808090');
    bar(x+21,25,sw-32,7,m.alive?f:0,c[0],c[1]);
    txt(m.alive?m.hp+'/'+m.maxHp:'しぼう',x+21,35,9,m.alive?'#c8c8dc':'#f06060'); });
  txt('MP',12,54,11,'#c8a8ff'); bar(32,56,118,8,G.mp/G.mpMax,'#a060ff','#4a2090'); txt(G.mp+'/'+G.mpMax,154,54,10,'#d8c8ff');
  dspr(SPR['sword'+G.weapon],W-84,61,1,0.9); txt(WEAPONS[G.weapon],W-96,54,10,'#ffd080','right'); txt(G.gold+'G',W-14,52,13,'#ffe060','right');
  const b=G.boss; if(b&&!b.entering){ win(36,78,W-72,24,0.75); txt(b.def.name,46,83,11,'#ffb0b0'); bar(136,84,W-182,10,clamp(b.hp/b.maxHp,0,1),b.p2?'#ff4060':'#ff8040',b.p2?'#800020':'#803010'); }
  win(4,H-76,W-8,72);
  G.msgs.forEach((s,i)=>txt(s,16,H-64+i*19,12,i===G.msgs.length-1?'#fff':'#b8b8cc'));
  const bx=W-44,by=H-124; dglow('#a060ff',40,bx,by,G.mp>=6?0.4+0.2*Math.sin(G.t*4):0.1);
  const bg=ctx.createRadialGradient(bx-6,by-8,2,bx,by,30); bg.addColorStop(0,'#3a2a6a'); bg.addColorStop(1,'#120a2a'); ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(bx,by,29,0,TAU); ctx.fill();
  ctx.strokeStyle='#e2c46a'; ctx.lineWidth=2; ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(bx,by,25,0,TAU); ctx.stroke();
  txt('じゅもん',bx,by-12,10,'#fff','center'); txt('MP '+G.mp,bx,by+2,10,'#c8a8ff','center');
  drawTopIcons();
  if(G.paused){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H); otxt('PAUSE',W/2,H/2-10,24,'#fff','center'); }
}
function drawMenu(){
  ctx.fillStyle='rgba(0,0,10,0.35)'; ctx.fillRect(0,0,W,H);
  const x=36,y=200,w=W-72,h=46+SPELLS.length*30+8; win(x,y,w,h);
  txt('じゅもん',x+14,y+12,14,'#ffe9a0'); txt('MP '+G.mp+'/'+G.mpMax,x+w-14,y+13,13,'#c8a8ff','right');
  ctx.fillStyle='rgba(226,196,106,0.5)'; ctx.fillRect(x+12,y+34,w-24,1);
  SPELLS.forEach((s,i)=>{ const yy=y+46+i*30; const caster=member(s.need); const ok=caster.alive&&G.mp>=s.mp; const col=ok?'#fff':'#707080';
    if(i===G.menu.sel){ ctx.fillStyle='rgba(226,196,106,0.15)'; rrect(x+8,yy-5,w-16,26,3); ctx.fill(); txt('▶',x+12,yy,14,'#ffe9a0'); }
    txt(s.n,x+32,yy,14,col); txt(s.mp+'MP',x+w-16,yy+1,12,ok?'#d8c8ff':'#707080','right');
    if(!caster.alive)txt('×',x+w-62,yy,12,'#f06060','right'); });
  const s=SPELLS[G.menu.sel]; win(x,y+h+4,w,48); txt(s.desc,x+12,y+h+14,11,'#e8e8f4'); txt('Z/Enter: けってい  X: もどる',x+12,y+h+31,10,'#9090b0');
}
function drawBanner(){
  const b=G.banner; const t=3-b.t; const a=t<0.3?t/0.3:b.t<0.5?b.t/0.5:1; const slide=t<0.3?(1-t/0.3)*W:0;
  ctx.save(); ctx.globalAlpha=a; ctx.translate(slide,0);
  const g=ctx.createLinearGradient(0,0,W,0); g.addColorStop(0,'rgba(80,0,20,0)'); g.addColorStop(0.2,'rgba(90,0,24,0.9)'); g.addColorStop(0.8,'rgba(90,0,24,0.9)'); g.addColorStop(1,'rgba(80,0,20,0)'); ctx.fillStyle=g; ctx.fillRect(0,H/2-50,W,90);
  ctx.fillStyle='#e2c46a'; ctx.fillRect(40,H/2-50,W-80,2); ctx.fillRect(40,H/2+38,W-80,2);
  otxt(b.name,W/2,H/2-36,28,'#ffe060','center'); otxt('— '+b.sub+' —',W/2,H/2+6,12,'#ffd0d0','center'); ctx.restore();
}
function drawLogo(x,y){
  ctx.font='32px '+FONT; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.lineJoin='round';
  ctx.lineWidth=8; ctx.strokeStyle='#2a1808'; ctx.strokeText('ゆうしゃの たいれつ',x+2,y+3);
  ctx.lineWidth=5; ctx.strokeStyle='#5a3a10'; ctx.strokeText('ゆうしゃの たいれつ',x,y);
  const g=ctx.createLinearGradient(0,y,0,y+34); g.addColorStop(0,'#fff6c0'); g.addColorStop(0.45,'#f8d040'); g.addColorStop(0.55,'#c08a10'); g.addColorStop(1,'#ffe890'); ctx.fillStyle=g; ctx.fillText('ゆうしゃの たいれつ',x,y);
}
function drawTitle(){
  drawBg(0,titleT*40,titleT);
  ctx.fillStyle='rgba(0,0,20,0.45)'; ctx.fillRect(0,0,W,H); drawVignette();
  // 紋章
  dglow('#ffd060',110,W/2,120,0.25+0.1*Math.sin(titleT*2));
  ctx.save(); ctx.translate(W/2,118); ctx.strokeStyle='rgba(226,196,106,0.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,70,0,TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(0,0,64,0,TAU); ctx.stroke();
  ctx.rotate(-Math.PI/4); ctx.fillStyle='rgba(232,232,244,0.35)'; ctx.fillRect(-3,-60,6,110); ctx.fillStyle='rgba(226,196,106,0.5)'; ctx.fillRect(-14,36,28,5); ctx.rotate(Math.PI/2); ctx.fillStyle='rgba(232,232,244,0.35)'; ctx.fillRect(-3,-60,6,110); ctx.fillStyle='rgba(226,196,106,0.5)'; ctx.fillRect(-14,36,28,5); ctx.restore();
  win(16,74,W-32,130,0.78);
  drawLogo(W/2,92);
  txt('〜 レトロRPGふう たてスクロール シューティング 〜',W/2,146,11,'#fff','center',true);
  txt('じゅもんコマンドで まおうを たおせ！',W/2,168,11,'#c8d8ff','center',true);
  const by=252+Math.sin(titleT*6)*2; const xs=((titleT*34)%(W+160))-80;
  const list=['hero','war','mage','priest']; list.forEach((k,i)=>shadow(xs-i*34,by+19,12,4,0.35)); list.forEach((k,i)=>dspr(SPR[k],xs-i*34,by+Math.sin(titleT*10+i)*2));
  win(20,292,W-40,196,0.85);
  const lines=['いどう： ほうこうキー / WASD / ドラッグ','じゅもん： X / Enter / がめんのボタン','こうげきは オートで おこなわれる','なかまが たおれると ひつぎになり','そうりょが いきていれば いきかえる かも','M： おんりょう  F： ぜんがめん  P： ポーズ'];
  lines.forEach((s,i)=>txt(s,36,308+i*27,12,i===3||i===4?'#c8d8ff':'#fff'));
  if(Math.floor(titleT*2)%2===0)otxt('▶ Z / Enter / タップ で はじめる',W/2,522,14,'#fff','center');
  txt('さいこうきろく： '+best+'G',W/2,562,12,'#ffe060','center',true);
  txt('♪ BGM・こうかおんは すべて オリジナル',W/2,602,10,'#b0b0c8','center',true);
  drawTopIcons();
}
function drawEnd(){
  const over=G.state==='over'; const t=over?G.overT:G.clearT; if(t<0.8)return;
  ctx.fillStyle='rgba(0,0,0,'+clamp((t-0.8)*0.8,0,0.65)+')'; ctx.fillRect(0,0,W,H);
  win(24,196,W-48,230);
  if(over){ txt('おうさま',40,212,12,'#ffe060'); txt('「おお ゆうしゃ アレンよ…',40,236,13); txt('  ここで たおれてしまうとは…',40,257,13); txt('  じゃが あきらめては ならぬ！」',40,278,13); }
  else { dglow('#ffd060',90,W/2,236,0.3); otxt('まおうゾルガを たおした！',W/2,218,16,'#ffe060','center'); txt('せかいに へいわが もどった！',W/2,250,14,'#fff','center'); txt('ゆうしゃたちの たびは つづく…',W/2,278,12,'#c8d8ff','center'); }
  ctx.fillStyle='rgba(226,196,106,0.5)'; ctx.fillRect(40,306,W-80,1);
  txt('こんかいの せいか： '+G.gold+'G',40,318,13,'#fff'); txt('たおした まもの： '+G.kills,40,341,13,'#fff');
  if(G.gold>=best&&G.gold>0)txt('★ さいこうきろく こうしん！',40,364,13,'#ffe060');
  if(t>1.5&&Math.floor(t*2)%2===0)txt('▶ Z / タップ で タイトルへ',W/2,396,13,'#fff','center');
}
function draw(){
  ctx.save();
  if(!G){ drawTitle(); ctx.restore(); return; }
  if(G.shake>0)ctx.translate(rnd(-G.shake,G.shake)*0.5,rnd(-G.shake,G.shake)*0.5);
  drawBg(G.stage,G.bgY,G.t);
  drawDrops(); drawEnemies(); drawParty(); drawBullets(); drawFx();
  drawVignette();
  if(G.flash){ ctx.fillStyle=G.flash.col; ctx.globalAlpha=clamp(G.flash.t*2,0,1); ctx.fillRect(-20,-20,W+40,H+40); ctx.globalAlpha=1; }
  ctx.restore();
  if(G.phase==='intro'&&G.phaseT<2.2){ const a=G.phaseT<0.3?G.phaseT/0.3:G.phaseT>1.8?(2.2-G.phaseT)/0.4:1; ctx.globalAlpha=a; win(40,H/2-44,W-80,66,0.85); txt('だい'+(G.stage+1)+'しょう',W/2,H/2-32,12,'#ffe060','center'); otxt(STAGES[G.stage].name,W/2,H/2-12,20,'#fff','center'); ctx.globalAlpha=1; }
  if(G.banner)drawBanner();
  drawHud();
  if(G.menu.open)drawMenu();
  if(G.state==='over'||G.state==='clear')drawEnd();
}

// ---------------------------------------------------------------- Loop
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  try{ update(dt); draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
</script>
